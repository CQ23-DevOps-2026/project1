apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    k8s-sidecar-target-directory: /tmp/dashboards/OpenTelemetry
data:
  observability-dashboard.json: |-
{{ .Files.Get "dashboards/observability_dashboard.json" | indent 4 }}
